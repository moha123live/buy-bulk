name: Angular CI/CD Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci  # Changed from npm install (cleaner install)

      - name: Build Angular App
        run: npm run build --prod
        
      - name: Verify Build Output
        run: |
          echo "Checking dist folder structure..."
          ls -la dist/
          echo "---"
          # Check if buy-bulk folder exists
          if [ -d "dist/buy-bulk" ]; then
            echo "Found dist/buy-bulk folder"
            ls -la dist/buy-bulk/
          else
            echo "dist/buy-bulk not found, listing all dist contents:"
            find dist/ -type f -name "*.html" | head -10
          fi

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: 46.202.161.53  # Direct IP, no ftp:// prefix
          username: u731226648.mohankumar.cloud  # Correct username from image
          password: ${{ secrets.HOSTINGER_PASS }}
          local-dir: ./dist/buy-bulk/
          server-dir: /public_html/
          protocol: ftp
          port: 21
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map